<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- astraOS: Poppins is the system typeface (SysBoard and the apps set it
     themselves); web pages get the fonts they ask for, or common ones in their
     place, not Poppins: sans-serif, serif and monospace are web fonts here, and
     fontconfig's own rules (conf.d) put Liberation (the metrics of Arial, Times
     New Roman and Courier New) where a page asks for those. Noto Color Emoji
     (OFL) draws emoji. -->
<fontconfig>
  <dir>/system/fonts</dir>
  <dir>/product/fonts</dir>
  <!-- Other scripts (Poppins is Latin only) and the web fonts: the device's packages. -->
  <dir>/system/share/fonts</dir>
  <cachedir>/data/var/cache/fontconfig</cachedir>
  <include ignore_missing="yes">conf.d</include>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>DejaVu Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Poppins</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
