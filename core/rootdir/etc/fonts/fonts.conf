<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- astraOS: Poppins is the system typeface, Noto Color Emoji (OFL) draws emoji -->
<fontconfig>
  <dir>/system/fonts</dir>
  <dir>/product/fonts</dir>
  <cachedir>/data/var/cache/fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Poppins</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Poppins</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Poppins</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
