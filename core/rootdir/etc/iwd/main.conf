# iwd: astrad manages Wi-Fi through iwd's D-Bus API. iwd configures the
# addresses itself (DHCP) and hands DNS servers to openresolv, which writes
# /run/resolv.conf (/etc is read-only).
[General]
EnableNetworkConfiguration=true

[Network]
NameResolvingService=resolvconf
EnableIPv6=true

# The interface the driver made, as it is. iwd otherwise deletes it to make its own,
# which on sweet's ath10k can fail ("NEW_INTERFACE failed: Too many open files in
# system"): then there is no Wi-Fi at all until iwd restarts.
[DriverQuirks]
DefaultInterface=*
