# astraOS runs one PipeWire for the whole phone, started by init: there is no
# login session and no seat.
#
# - WirePlumber's Bluetooth monitor waits for an active seat before it offers the
#   phone's audio to headphones and speakers, and would wait forever.
# - Volume, mute and the chosen output are astrad's (the Sound settings), told at
#   every start. What WirePlumber saved by itself is not kept: a speaker muted or
#   turned to zero once (a test, a bad moment) would otherwise stay silent through
#   every restart.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    hooks.device.profile.state = disabled
    hooks.device.routes.state = disabled
    hooks.default-nodes.state = disabled
    hooks.stream.state = disabled
  }
}
